name: Wakeful
options:
  bundleIdPrefix: dev.duongdev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are ad-hoc signed. Release builds override signing.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  WakefulCore:
    path: WakefulCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Wakeful:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: WakefulCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.duongdev.Wakeful
        WAKEFUL_URL_SCHEME: wakeful
        PRODUCT_NAME: Wakeful
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wakeful
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Dustin Do. MIT License."
        INFOPLIST_FILE: App/Info.plist
      # Debug builds get their own identity, so they do not share settings, links or login items with an installed copy.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.duongdev.Wakeful.debug
          INFOPLIST_KEY_CFBundleDisplayName: Wakeful Dev
          WAKEFUL_URL_SCHEME: wakeful-dev
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(WAKEFUL_URL_SCHEME)]
        SUFeedURL: https://github.com/duongdev/wakeful/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: ZDZLYT/r/B0hdmqkaXwvoNPLSzLHf+baviqeVhwXaUU=
