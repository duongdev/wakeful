name: Wakeful
options:
  bundleIdPrefix: dev.duongdev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are ad-hoc signed. Release builds override signing.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  WakefulCore:
    path: WakefulCore

targets:
  Wakeful:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: WakefulCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.duongdev.Wakeful
        PRODUCT_NAME: Wakeful
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wakeful
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Dustin Do. MIT License."
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.duongdev.Wakeful
            CFBundleURLSchemes: [wakeful]
