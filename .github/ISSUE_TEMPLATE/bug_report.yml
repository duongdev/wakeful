name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on for 30 minutes
        2. Lock the screen
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wakeful version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.2, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings > Advanced > Copy logs, then paste here.
      render: text
